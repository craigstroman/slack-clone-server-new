query hello {
  hello
}

query GetChatRooms {
  chatRooms {
    id
    name
  }
}

mutation CreateChatRoom {
  createChatRoom(name: "Test Chat Room", user_id: 1) {
    id
    name
    createdAt
    user_id
  }
}

mutation SendChatMessage {
  sendMessage(input: { roomId: 1, username: "M", text: "Testing the chat subscription" }) {
    id
    roomId
    username
    text
    createdAt
  }
}

subscription WatchChatMessages {
  messageSent(roomId: 1) {
    id
    roomId
    username
    text
    createdAt
  }
}
